<html><head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width initial-scale=1.0">
    
    <title>
        
        Register New Member / Shinobi Securities
    
    </title>
    
    <!-- GLOBAL MAINLY STYLES-->
    <link href="./assets/vendors/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="./assets/vendors/font-awesome/css/font-awesome.min.css" rel="stylesheet">
    <link href="./assets/vendors/themify-icons/css/themify-icons.css" rel="stylesheet">
    <!-- THEME STYLES-->
    <link href="assets/css/main.css" rel="stylesheet">
    <!-- PAGE LEVEL STYLES-->
    <link href="./assets/css/pages/auth-light.css" rel="stylesheet">
</head>

<body class="bg-silver-300 has-animation">
    <div class="content">
        <div class="brand">
            <a class="link" href="index.html">Shinobi Securities</a>
        </div>
        <form id="register-form" action="javascript:;" method="post" novalidate="novalidate">
            
            <h2 class="login-title">
                
                Register New Member
            
            </h2>
            
            <div class="row">
                <div class="col-12">
                    <div class="form-group">
                        <input id="username" class="form-control" type="text" name="first_name" placeholder="User Name">
                    </div>
                </div>
                
            </div>
            <div class="form-group">
                <input id="email" class="form-control" type="email" name="email" placeholder="Email Address" autocomplete="off">
            </div>
            <div class="form-group">
                <input id="password" class="form-control" id="password" type="password" name="password" placeholder="Password">
            </div>
            <div class="form-group">
                <input class="form-control" type="password" name="password_confirmation" placeholder="Confirm Password">
            </div>
            <div class="form-group text-left">
                <label class="ui-checkbox ui-checkbox-info">
                    <input id="termsAndPolicy" type="checkbox" name="agree">
                    <span class="input-span"></span>I agree the terms and policy</label>
            </div>
            <div class="form-group">
                <button class="btn btn-info btn-block" type="button" onclick="onSubmit()">Register New Member</button>
            </div>
            
            
            <div class="text-center">Already a member?
                <a class="color-blue" href="login.html">Login Here</a>
            </div>
        </form>
    </div>
    <!-- BEGIN PAGA BACKDROPS-->
    <div class="sidenav-backdrop backdrop"></div>
    <div class="preloader-backdrop" style="display: none;">
        <div class="page-preloader">Loading</div>
    </div>
    <!-- END PAGA BACKDROPS-->
    <!-- CORE PLUGINS -->
    <script src="./assets/vendors/jquery/dist/jquery.min.js" type="text/javascript"></script>
    <script src="./assets/vendors/popper.js/dist/umd/popper.min.js" type="text/javascript"></script>
    <script src="./assets/vendors/bootstrap/dist/js/bootstrap.min.js" type="text/javascript"></script>
    <!-- PAGE LEVEL PLUGINS -->
    <script src="./assets/vendors/jquery-validation/dist/jquery.validate.min.js" type="text/javascript"></script>
    <!-- CORE SCRIPTS-->
    <script src="assets/js/app.js" type="text/javascript"></script>
    <!-- PAGE LEVEL SCRIPTS-->
    <script type="text/javascript">
        $(function() {
            $('#register-form').validate({
                errorClass: "help-block",
                rules: {
                    first_name: {
                        required: true,
                        minlength: 2
                    },
                    last_name: {
                        required: true,
                        minlength: 2
                    },
                    email: {
                        required: true,
                        email: true
                    },
                    password: {
                        required: true,
                        confirmed: true
                    },
                    password_confirmation: {
                        equalTo: password
                    }
                },
                highlight: function(e) {
                    $(e).closest(".form-group").addClass("has-error")
                },
                unhighlight: function(e) {
                    $(e).closest(".form-group").removeClass("has-error")
                },
            });
        });
    </script>
    
        <script src="./scripting/member/create.js" type="text/javascript"></script>



</body></html>
